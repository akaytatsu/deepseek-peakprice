services:
  web:
    build: .
    ports:
      - "5173:5173"
    volumes:
      - .:/app            # live source code (hot reload)
      - /app/node_modules # anonymous volume keeps the image's npm ci install
    restart: unless-stopped
    # Uncomment only if file watching does not trigger (macOS/Windows/network FS):
    # environment:
    #   CHOKIDAR_USEPOLLING: "true"
